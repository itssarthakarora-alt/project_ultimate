<body>
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Create Your UltShops Account</h1>
    <form class="login" id="login-form" action="https://ultimatesshop.vc/locked/" method="post">
        <div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-xxl-4 col-lg-5">
                        <div class="card">
                            <!-- Logo -->
                            <div class="card-header py-4 text-center">
                                <img src="assets/img/logo2.png" alt="UltShops logo" width="350" height="200" fetchpriority="high" style="float: center;">
                            </div>
                            <div class="card-body p-4">
                                <input type="hidden" name="_token" value="jGZWcbLUbTscv0EJ5aM1OmoRHKsNCVGbutA3OE5e">
                                <div style="clear:both;text-align:center;color:red;"></div>
                                <br>
                                <div class="mb-3">
                                    <label for="emailaddress" class="form-label">Username</label>
                                    <input class="form-control" name="username" id="reg_username" type="text" maxlength="30">
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input class="form-control" name="password" id="reg_password" type="password" maxlength="25">
                                </div>
                                <div class="mb-3">
                                    <label for="password2" class="form-label">Repeat Password</label>
                                    <input class="form-control" name="password_repeat" id="reg_password_repeat" type="password">
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Jabber (Optional)</label>
                                    <input class="form-control" placeholder="Optional" name="jabber" id="reg_jabber" type="text" value="">
                                </div>
                                <div>
                                    <label for="reg_verifyCode">Code</label>
                                    <input style="width:100px;" name="captcha" id="reg_verifyCode" type="text">
                                    <img id="yw0" src="assets/img/captcha.png" alt="">
                                </div>
                            </div>
                            <div class="mb-3 mb-0 text-center">
                                <a href="index.html" style="color:black !important;" class="btn btn-warning ms-1"><b>&lt;-</b></a>
                                <button class="btn btn-warning" style="color:black !important;" type="submit"> Register
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <style>
